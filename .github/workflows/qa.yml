name: Laravel and frontend QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP, SQLite safety suite and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      ARSAM_AUDIT_HMAC_KEY: ci-only-not-a-production-secret-0123456789abcdef0123456789abcdef
      PENNANT_STORE: database
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, sqlite3, openssl, intl, gd
          coverage: none
          tools: composer:v2

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare disposable test configuration
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan config:clear

      - name: Check PHP code style
        run: php vendor/bin/pint --test

      - name: Run PHPUnit with forced in-memory SQLite
        run: php artisan test

      - name: Build locked frontend dependencies
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Validate staging preflight without executing it
        run: php -l scripts/staging_preflight.php

      - name: Validate live smoke shell syntax without running it
        run: bash -n scripts/kavenegar_live_smoke.sh
